<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <!-- The recorded attention weights at step 200, position 3, head 0. Real
         numbers from traces/python/micro/attn.jsonl, not a decorative pattern:
         the trained model puts 0.394 on position 0 and 0.174 on itself, which is
         the finding the multi-head-attention concept is about. -->
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2f95e8"/>
      <stop offset="0.236" stop-color="#2f95e8"/>
      <stop offset="0.472" stop-color="#1f74bd"/>
      <stop offset="0.708" stop-color="#17558c"/>
      <stop offset="0.944" stop-color="#123a5c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <text x="80" y="120" fill="#e6edf3" font-size="64" font-weight="700" letter-spacing="-1.5">learn microgpt</text>
  <text x="80" y="176" fill="#9198a1" font-size="30">a concept atlas for 199 lines</text>

  <text x="80" y="252" fill="#6fc2ff" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">microgpt.py</text>
  <text x="300" y="252" fill="#e6edf3" font-size="24">— Andrej Karpathy, reproduced byte-for-byte</text>

  <g transform="translate(80, 300)">
    <rect width="640" height="200" rx="12" fill="#161b22" stroke="#3d444d"/>
    <text x="28" y="44" fill="#9198a1" font-size="18">attention weights · step 200 · position 3 · head 0</text>
    <!-- Four bars, the four recorded weights, scaled to the largest. -->
    <g transform="translate(28, 72)">
      <rect x="0"    y="0"   width="280" height="34" rx="4" fill="url(#heat)"/>
      <rect x="300"  y="0"   width="168" height="34" rx="4" fill="#1f74bd"/>
      <rect x="600"  y="0"   width="140" height="34" rx="4" fill="#17558c"/>
      <rect x="900"  y="0"   width="124" height="34" rx="4" fill="#123a5c"/>
      <g fill="#e6edf3" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="0"   y="58">0.394</text>
        <text x="300" y="58">0.236</text>
        <text x="600" y="58">0.197</text>
        <text x="900" y="58">0.174</text>
        <text x="0"   y="88" fill="#6e7681">position 0</text>
        <text x="300" y="88" fill="#6e7681">position 1</text>
        <text x="600" y="88" fill="#6e7681">position 2</text>
        <text x="900" y="88" fill="#6e7681">position 3  ← the current position, last</text>
      </g>
    </g>
  </g>

  <g transform="translate(80, 540)" fill="#9198a1" font-size="22">
    <text x="0" y="0">18 concepts</text>
    <text x="180" y="0">·</text>
    <text x="210" y="0">5 languages</text>
    <text x="370" y="0">·</text>
    <text x="400" y="0">every number measured from a real run</text>
  </g>

  <!-- A single underline in the accent colour, matching the site's wordmark. -->
  <rect x="80" y="586" width="220" height="4" rx="2" fill="#4493f8"/>
</svg>
