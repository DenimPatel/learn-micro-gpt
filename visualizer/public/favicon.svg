<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="learn microgpt">
  <!--
    The site mark: four cells, which is the shape of one attention head's output
    and the shape of the favicon's own 2x2 grid. Opacity steps up across the cells
    so it stays legible at 16px, where four identical squares would read as one
    grey blob.
  -->
  <rect width="32" height="32" rx="8" fill="#6d3bf5" />
  <g fill="#ffffff">
    <rect x="7" y="7" width="8" height="8" rx="2" opacity="0.38" />
    <rect x="17" y="7" width="8" height="8" rx="2" opacity="0.58" />
    <rect x="7" y="17" width="8" height="8" rx="2" opacity="0.78" />
    <rect x="17" y="17" width="8" height="8" rx="2" />
  </g>
</svg>
